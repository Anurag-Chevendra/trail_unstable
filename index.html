<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"]{
  --bg:#0A0C10;--panel:#11141A;--raised:#161A21;--line:#202630;
  --text:#EDF0F4;--dim:#98A2B0;--faint:#69727F;
  --clean:#3FCF8E;--cleanbg:rgba(63,207,142,.09);--cleanbd:rgba(63,207,142,.28);
  --alert:#FF6B6B;--alertbg:rgba(255,107,107,.09);--alertbd:rgba(255,107,107,.30);
  --neutbg:#171C24;--neutbd:#262D38;
}
:root[data-theme="light"]{
  --bg:#FCFCFD;--panel:#FFFFFF;--raised:#F5F6F8;--line:#E5E8ED;
  --text:#11141A;--dim:#5C6675;--faint:#8A94A2;
  --clean:#0E9F63;--cleanbg:rgba(14,159,99,.08);--cleanbd:rgba(14,159,99,.25);
  --alert:#D33B45;--alertbg:rgba(211,59,69,.07);--alertbd:rgba(211,59,69,.24);
  --neutbg:#F3F4F7;--neutbd:#E0E4EA;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;
  font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
code,.mono{font-family:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace}

.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1040px;margin:0 auto;padding:18px 28px;display:flex;align-items:center;gap:16px}
.brand{font-family:'Geist Mono',monospace;font-weight:600;font-size:20px;letter-spacing:-.03em}
.brand em{font-style:normal;color:var(--clean)}
.updated{font-size:13px;color:var(--faint)}
.spacer{flex:1}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--dim)}
.iconbtn:hover{color:var(--text);border-color:var(--neutbd)}
/* Same height and border as the theme toggle so the two read as one control
   group rather than a button with a stray link next to it. */
.navlink{display:inline-flex;align-items:center;height:34px;padding:0 14px;
  border-radius:9px;border:1px solid var(--line);color:var(--dim);
  font-size:14px;transition:color .15s,border-color .15s}
.navlink:hover{color:var(--text);border-color:var(--neutbd)}
@media(max-width:420px){.navlink{padding:0 11px;font-size:13px}}
.wrap{max-width:1040px;margin:0 auto;padding:36px 28px 120px}

/* verdict */
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
  letter-spacing:.05em;padding:6px 13px;border-radius:8px;border:1px solid}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.clean{color:var(--clean);background:var(--cleanbg);border-color:var(--cleanbd)}
.pill.review{color:var(--alert);background:var(--alertbg);border-color:var(--alertbd)}
.pill.lg{font-size:13px;padding:8px 16px}

/* landing */
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;margin-top:4px}
.search{flex:1;min-width:240px;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:13px 17px;color:var(--text);font-size:15px}
.search::placeholder{color:var(--faint)}
.search:focus{outline:none;border-color:var(--neutbd)}
.seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:4px}
.seg button{font-size:13px;font-weight:500;padding:9px 16px;border-radius:8px;color:var(--dim)}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;
  display:flex;flex-direction:column;gap:14px;transition:.15s}
.card:hover{border-color:var(--neutbd);transform:translateY(-2px)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pname{font-family:'Geist Mono',monospace;font-size:15px;font-weight:500;
  letter-spacing:-.02em;word-break:break-word;line-height:1.4}
.pver{font-family:'Geist Mono',monospace;font-size:13px;color:var(--faint);margin-top:3px}
.card-foot{display:flex;justify-content:space-between;font-size:13px;color:var(--faint);
  margin-top:auto;padding-top:4px}

/* package head */
.back{font-size:14px;color:var(--faint);display:inline-block;margin-bottom:26px}
.back:hover{color:var(--text)}
.phead{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.ptitle{font-family:'Geist Mono',monospace;font-size:28px;font-weight:600;
  letter-spacing:-.035em;line-height:1.2;word-break:break-word;flex:1;min-width:230px;margin:0}
.dd{position:relative}
.ddbtn{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500;
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:11px;padding:9px 13px 9px 15px;transition:.15s}
.ddbtn:hover{border-color:var(--neutbd)}
.ddbtn svg{color:var(--faint);transition:transform .2s}
.ddbtn[aria-expanded=true]{border-color:var(--neutbd)}
.ddbtn[aria-expanded=true] svg{transform:rotate(180deg)}
.ddmenu{position:absolute;top:calc(100% + 8px);right:0;min-width:190px;
  background:var(--panel);border:1px solid var(--neutbd);border-radius:13px;padding:6px;
  box-shadow:0 16px 40px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.2);z-index:40;
  opacity:0;visibility:hidden;transform:translateY(-6px);transition:.16s ease}
.ddbtn[aria-expanded=true]+.ddmenu{opacity:1;visibility:visible;transform:none}
.dditem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 12px;border-radius:9px;font-size:14px;color:var(--dim);transition:.12s}
.dditem:hover{background:var(--raised);color:var(--text)}
.dditem[aria-selected=true]{color:var(--text)}
.dditem .tick{width:14px;flex:none;color:var(--clean);opacity:0}
.dditem[aria-selected=true] .tick{opacity:1}
.dditem .vnum{font-family:'Geist Mono',monospace;font-size:13.5px}
.pfacts{display:flex;gap:20px;flex-wrap:wrap;color:var(--dim);font-size:14px;margin-bottom:16px}
.pfacts b{color:var(--text);font-weight:500}
.shabar{display:flex;align-items:center;gap:14px;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;padding:12px 16px;margin-bottom:40px}
.shalab{font-size:11px;color:var(--faint);letter-spacing:.1em;font-weight:600;flex:none}
.shaval{font-family:'Geist Mono',monospace;font-size:13px;color:var(--dim);
  word-break:break-all;flex:1;line-height:1.5}
.copy{flex:none;font-size:12px;color:var(--faint);border:1px solid var(--line);
  padding:5px 11px;border-radius:7px}
.copy:hover{color:var(--text);border-color:var(--neutbd)}

/* sections — no hairlines */
.sec{margin-bottom:40px}
.sech{font-size:19px;font-weight:600;letter-spacing:-.02em;color:var(--text);margin:0 0 16px}
.block{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:8px 22px 18px;margin-bottom:14px}
.blockhead{display:flex;align-items:center;gap:10px;padding:14px 0 12px;width:100%;text-align:left}
.btitle{font-size:15px;font-weight:600;flex:1;letter-spacing:-.01em}
.caret{width:7px;height:7px;border-right:1.5px solid var(--faint);
  border-bottom:1.5px solid var(--faint);transform:rotate(45deg);transition:.2s;flex:none}
.blockhead[aria-expanded=false] .caret{transform:rotate(-45deg)}
.blockhead[aria-expanded=false]+.bbody{display:none}

/* label / pill rows */
.r{display:flex;gap:20px;padding:9px 0;align-items:flex-start}
.rl{width:190px;flex:none;color:var(--dim);font-size:14px;padding-top:3px}
.rv{flex:1;display:flex;flex-wrap:wrap;gap:7px}
.t{font-family:'Geist Mono',monospace;font-size:12.5px;padding:4px 10px;border-radius:7px;
  background:var(--neutbg);border:1px solid var(--neutbd);color:var(--dim);
  word-break:break-all;line-height:1.45}
.t.hot{background:var(--alertbg);border-color:var(--alertbd);color:var(--alert)}
.t.nil{color:var(--faint);opacity:.75}

/* static — horizontal filter bar */
.bar{display:inline-flex;gap:3px;background:var(--panel);border:1px solid var(--line);
  border-radius:13px;padding:4px}
.b{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;
  color:var(--dim);font-size:14px;font-weight:500;transition:.16s ease;line-height:1.3}
.b:hover{color:var(--text)}
.b[aria-pressed=true]{background:var(--raised);color:var(--text);font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.18)}
.b:focus-visible{outline:2px solid var(--neutbd);outline-offset:1px}
.b .c{font-size:12.5px;font-weight:500;color:var(--faint);
  font-variant-numeric:tabular-nums;transition:color .16s}
.b.threat .c{color:var(--alert);opacity:.8}
.b .c.zero{color:var(--faint);opacity:.55}
.b[aria-pressed=true] .c{color:var(--dim);opacity:1}
.split{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start;margin-top:20px}
.rail{background:var(--panel);border-radius:14px;padding:8px 8px 10px}
.b2{position:relative;display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:10px 12px 10px 14px;border-radius:10px;color:var(--dim);font-size:14px;
  transition:background .16s,color .16s}
.b2::before{content:'';position:absolute;left:3px;top:50%;width:2.5px;height:17px;
  border-radius:2px;background:var(--text);
  transform:translateY(-50%) scaleY(0);transition:transform .2s ease}
.b2:hover{color:var(--text);background:var(--raised)}
.b2[aria-pressed=true]{color:var(--text);background:var(--raised);font-weight:600}
.b2[aria-pressed=true]::before{transform:translateY(-50%) scaleY(1)}
.b2:focus-visible{outline:2px solid var(--neutbd);outline-offset:-2px}
.b2 .n{flex:1;word-break:break-word}
.b2 .c{font-size:12.5px;color:var(--faint);flex:none;font-variant-numeric:tabular-nums;
  min-width:16px;text-align:right}
.b2[aria-pressed=true] .c{color:var(--dim)}
.raillab{font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  color:var(--faint);padding:16px 14px 7px;opacity:.75}
.raillab:first-child{padding-top:6px}
.rcar{width:5px;height:5px;border-right:1.5px solid var(--faint);
  border-bottom:1.5px solid var(--faint);transform:rotate(45deg);flex:none;
  transition:transform .2s ease;margin:0 3px 0 1px}
.rcar.closed{transform:rotate(-45deg)}
.b2[aria-pressed=true] .rcar{border-color:var(--text)}
.rgap{width:5px;margin:0 3px 0 1px;flex:none}
.rkids{margin:2px 0 6px 0;padding:0}
.b3{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:7px 12px 7px 28px;border-radius:9px;color:var(--faint);font-size:13.5px;
  transition:background .16s,color .16s}
.b3:hover{color:var(--text);background:var(--raised)}
.b3[aria-pressed=true]{color:var(--text);background:var(--raised);font-weight:500}
.b3:focus-visible{outline:2px solid var(--neutbd);outline-offset:-2px}
.b3 .n{flex:1;word-break:break-word}
.b3 .c{font-size:12px;flex:none;font-variant-numeric:tabular-nums;
  min-width:16px;text-align:right}
.stack{background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:4px 22px 16px}
.split .stack{margin-top:0}
.stack.solo{margin-top:20px}
@media(max-width:760px){.split{grid-template-columns:1fr}}
.rulehd{font-size:14px;font-weight:600;color:var(--dim);
  margin:22px 0 2px;display:flex;align-items:center;gap:9px}
.rulehd:first-child{margin-top:14px}
.rulehd .c{font-size:11.5px;font-weight:500;color:var(--faint)}

/* entropy table */
.frow{padding:15px 0;border-top:1px solid var(--line)}
.frow:first-child{border-top:none;padding-top:10px}
.ftop{display:flex;align-items:baseline;gap:16px}
.fpath{flex:1;font-family:'Geist Mono',monospace;font-size:13.5px;word-break:break-all}
.fscale{display:flex;align-items:center;gap:8px;flex:none;align-self:center;
  font-family:'Geist Mono',monospace;font-size:11.5px;color:var(--faint)}
.fbar{position:relative;width:132px;height:6px;border-radius:4px;background:var(--neutbg);
  border:1px solid var(--neutbd);cursor:default}
.fbar i{display:block;height:100%;background:var(--dim);border-radius:4px;
  transition:background .16s}
.fbar:hover i{background:var(--text)}
.fhi .fbar i{background:var(--alert)}
.fbar .tip{position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);
  background:var(--bg);border:1px solid var(--neutbd);border-radius:8px;padding:5px 10px;
  font-family:'Geist Mono',monospace;font-size:12.5px;color:var(--text);
  font-variant-numeric:tabular-nums;white-space:nowrap;
  opacity:0;visibility:hidden;transition:.14s;z-index:20;
  box-shadow:0 8px 22px rgba(0,0,0,.4)}
.fbar:hover .tip,.fbar:focus-visible .tip{opacity:1;visibility:visible}
.fbar:focus-visible{outline:2px solid var(--neutbd);outline-offset:2px}
.fmeta{display:flex;gap:9px;align-items:baseline;margin-top:6px;
  font-size:12.5px;color:var(--faint)}
.fsize{flex:none;font-variant-numeric:tabular-nums}
.fhash{font-family:'Geist Mono',monospace;font-size:12px;color:var(--faint);
  word-break:break-all;opacity:.85}
.fhead{display:flex;align-items:baseline;gap:16px;padding:10px 0 4px;
  font-size:12.5px;color:var(--faint);font-weight:600}
.fhead .s1{flex:1}.fhead .s2{width:164px;flex:none;text-align:center}

/* static entries */
.entry{padding:18px 0 20px;border-top:1px solid var(--line)}
.entry:first-of-type{border-top:none;padding-top:8px}
.etop{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.ename{font-size:15px;font-weight:600;letter-spacing:-.01em}
.sev{font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;letter-spacing:.03em;
  background:var(--neutbg);border:1px solid var(--neutbd);color:var(--dim)}
.sev.high{background:var(--alertbg);border-color:var(--alertbd);color:var(--alert)}
.tac{font-size:11px;padding:2px 8px;border-radius:5px;background:var(--neutbg);
  border:1px solid var(--neutbd);color:var(--faint);font-family:'Geist Mono',monospace}
.info{position:relative;width:17px;height:17px;border-radius:50%;border:1px solid var(--neutbd);
  color:var(--faint);font-size:10px;font-weight:600;display:grid;place-items:center;flex:none;
  cursor:default}
.info:hover,.info:focus-visible{color:var(--text);border-color:var(--dim);outline:none}
.info .tip{position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);
  background:var(--bg);border:1px solid var(--neutbd);border-radius:9px;padding:9px 13px;
  font-family:'Geist',sans-serif;font-size:13px;font-weight:400;color:var(--text);
  width:max-content;max-width:320px;line-height:1.5;text-align:left;
  opacity:0;visibility:hidden;transition:.15s;z-index:20;
  box-shadow:0 8px 26px rgba(0,0,0,.4)}
.info:hover .tip,.info:focus-visible .tip{opacity:1;visibility:visible}
.eloc{font-family:'Geist Mono',monospace;font-size:12.5px;color:var(--faint);
  margin-bottom:9px;word-break:break-all}
.ecode{font-family:'Geist Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--dim);
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 14px;
  white-space:pre-wrap;word-break:break-word;max-height:150px;overflow:auto}
.ematch{display:flex;gap:9px;align-items:baseline;margin-top:9px;font-size:13px;color:var(--faint)}
.ematch code{font-size:12.5px;color:var(--alert);background:var(--alertbg);
  border:1px solid var(--alertbd);border-radius:6px;padding:2px 8px;word-break:break-all}
.grp{font-size:13px;font-weight:600;color:var(--dim);margin:16px 0 10px}
.grp:first-child{margin-top:6px}
.none{color:var(--faint);font-size:14px;padding:8px 0}
.notice{border:1px solid var(--line);border-radius:11px;padding:15px 18px;
  color:var(--dim);font-size:14px;background:var(--raised)}
@media(max-width:640px){.rl{width:100%;padding-top:0}.r{flex-direction:column;gap:7px}
  .ptitle{font-size:22px}.wrap{padding:24px 18px 90px}.top-in{padding:16px 18px}}
</style>
</head>

// ALL is filled from the API on boot. The fixtures stay as a fallback so the
// page still renders for design work with no backend, and so a Worker outage
// degrades to a stale-but-working page instead of a blank one.
let ALL=[], usingFixtures=false;
const LIMIT=100;let view="landing",filter="ALL",q="",cur=0;
const app=document.getElementById("app");
document.getElementById("upd").textContent="updated "+new Date()
  .toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kb=b=>b>=1048576?(b/1048576).toFixed(1)+" MB":Math.round(b/1024)+" KB";
const short=s=>s.replace(/^\/test\/node_modules\//,"");
/* Rule names are shown with their separators as spaces. Display only --
   grouping, matching and the copied JSON all still use the raw name. */
const pretty=s=>{const t=String(s).replace(/[-_]/g," ");
  return t.charAt(0).toUpperCase()+t.slice(1);};

function landing(){
  // ALL already holds the server's answer for the current filter and query,
  // so no further narrowing here -- doing both would silently re-limit the
  // results to whatever happened to be in the last fetch.
  const rows=usingFixtures
    ? ALL.slice(0,LIMIT).filter(p=>(filter==="ALL"||p.verdict===filter)&&
        (!q||p.name.toLowerCase().includes(q)||p.version.includes(q)))
    : ALL;
  return `<div class="controls">
    <input class="search" id="q" placeholder="Search package name or version…" value="${esc(q)}">
    <div class="seg">${["ALL","REVIEW","CLEAN"].map(f=>
      `<button data-f="${f}" aria-pressed="${filter===f}">${f[0]+f.slice(1).toLowerCase()}</button>`).join("")}</div>
  </div>
  <div class="grid">${rows.map(p=>`<a class="card" href="#" data-open="${ALL.indexOf(p)}">
    <div class="card-top">
      <div><div class="pname">${esc(p.name)}</div><div class="pver">v${esc(p.version)}</div></div>
      <span class="pill ${p.verdict.toLowerCase()}">${p.verdict}</span></div>
    <div class="card-foot"><span>${p.ago}</span><span>View</span></div></a>`).join("")}</div>`;
}

/* label + pill row. `hot` marks values that are themselves the concern. */
/**
 * Shorten a path for display. The full value stays in the title attribute, so
 * nothing is lost -- but a row of 55-character strings is unreadable, and most
 * of that length carries no information: /tmp/ is where all of these live, and
 * the 13-digit epoch suffix a stager appends is a uniquifier, not a fact
 * anyone reads. What identifies the file is the middle.
 */
function shortPath(x){
  let s=String(x);
  // keep any annotation we appended, e.g. "  (built from aws)"
  const note=s.match(/\s{2}\(.*\)$/); if(note) s=s.slice(0,note.index);
  // Applied unconditionally, not only to long values: a column where some
  // rows are stripped and others aren't reads as inconsistent rather than
  // tidy, and the dropped parts carry no information either way.
  let out=s.replace(/-\d{10,}(?=\.|$)/,"")            // epoch-ms uniquifier
           .replace(/^\/(tmp|var\/tmp|root|home\/[^/]+)\//,"…/");
  if(out.length>44){                                  // still long: keep the tail
    const parts=out.split("/");
    if(parts.length>2) out="…/"+parts.slice(-2).join("/");
  }
  if(out.length>44) out=out.slice(0,18)+"…"+out.slice(-24);
  return note?out+note[0]:out;
}

function row(label,vals,hot){
  const v=vals.length
    ? vals.map(x=>{const sh=shortPath(x);
        return `<span class="t ${hot?"hot":""}"${sh!==String(x)?` title="${esc(x)}"`:""}>${esc(sh)}</span>`;
      }).join("")
    : `<span class="t nil">none</span>`;
  return `<div class="r"><div class="rl">${label}</div><div class="rv">${v}</div></div>`;
}
function block(id,title,body){
  return `<div class="block">
    <button class="blockhead" aria-expanded="true" data-b="${id}">
      <span class="btitle">${title}</span><span class="caret"></span></button>
    <div class="bbody">${body}</div></div>`;
}
function entry(e,i){
  return `<div class="entry">
    <div class="etop">
      <span class="ename">${esc(pretty(e.rule))}</span>
      <span class="info" tabindex="0">i<span class="tip">${esc(e.message)}</span></span>
      ${e.severity?`<span class="sev ${e.severity==="high"?"high":""}">${esc(e.severity)}</span>`:""}
      ${(e.tactics||[]).map(t=>`<span class="tac">${esc(t)}</span>`).join("")}
    </div>
    ${e.location?`<div class="eloc">${esc(e.location)}</div>`:""}
    ${e.code?`<div class="ecode">${esc(e.code)}</div>`:""}
    ${e.match?`<div class="ematch">match <code>${esc(e.match)}</code></div>`:""}
    ${(!e.location&&!e.code&&!e.match&&e.message)
      ? `<div class="ecode">${esc(e.message)}</div>` : ""}
  </div>`;
}

function detail(p){
  const f=p.fs;
  return `<a class="back" href="#" data-back>All packages</a>
  <div class="phead"><h1 class="ptitle">${esc(p.name)}</h1>
    <div class="dd">
      <button class="ddbtn" aria-expanded="false" data-ddbtn>

        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="ddmenu">${p.versions.map(v=>`<button class="dditem" data-ver="${esc(v)}"
        aria-selected="${v===p.version}">
        <svg class="tick" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <span class="vnum">v${esc(v)}</span></button>`).join("")}</div>

    <span class="pill lg ${p.verdict.toLowerCase()}">${p.verdict}</span></div>
  <div class="pfacts"><span>npm</span><span><b>${kb(p.bytes)}</b></span>
    <span>Analysed <b>${p.ago}</b></span></div>

    ${block("net","Network",
      row("Package connections",p.net.package_connections,true)+
      row("Non-registry DNS",p.net.dns_lookups_non_npm,true)+
      row("Exfil services contacted",p.net.exfil_services_contacted,true))}
    ${block("cred","Credentials",
      row("Tokens leaked",p.cred.canary_tokens_leaked,true)+
      row("Accessed by package",p.cred.accessed_by_package,true)+
      row("Probed but absent",p.cred.probed_but_absent,true)+
      row("Sensitive file access",p.cred.sensitive_file_access))}
    ${block("fs","Filesystem",
      row("Dropped and executed",f.dropped_and_executed.map(short),true)+
      row("Executed by package",f.executed_by_package.map(short),f.dropped_and_executed.length>0)+
      row("Package files written",f.package_files_written,true)+
      row("Exfil staging",f.exfil_staging||[],true)+
      row("Archives written",f.archives_written||f.downloaded_artifacts||[],true)+
      row("Tmp snooped",f.tmp_snooped,true)+
      row("Recon dirs enumerated",f.recon_dirs_enumerated,true)+
      row("Package files read",f.package_files_read))}
  </section>

  <section class="sec"><h2 class="sech">Static</h2>
    ${staticBar(p)}
  </section>`;
}

/* Group rules into families. A rule's family is its name minus the last
   hyphen segment, but only when at least two rules share that stem -- so
   threat-runtime-obfuscation-{general,base64exec,steganography} collapse into
   one node while threat-runtime-environment-read, which shares nothing, stays
   at the top level instead of being dragged under a vaguer "threat-runtime". */
function families(list){
  const names=[...new Set(list.map(e=>e.rule))];
  const stem=n=>n.split("-").slice(0,-1).join("-");
  const tally={};
  names.forEach(n=>{tally[stem(n)]=(tally[stem(n)]||0)+1});
  const keyOf=n=>{
    if(tally[n])return n;                    // rule IS the stem of others
    return tally[stem(n)]>1?stem(n):n;
  };
  const out={};
  list.forEach(e=>{
    const k=keyOf(e.rule);
    (out[k]=out[k]||{key:k,rules:{},n:0});
    (out[k].rules[e.rule]=out[k].rules[e.rule]||[]).push(e);
    out[k].n++;
  });
  return Object.values(out).sort((a,b)=>b.n-a.n);
}

// `open` tracks which rule families are expanded. It must be declared: an
// undeclared `open` silently resolves to window.open in a browser, so the
// expansion state ends up as properties on a global function.
let sel=null, open={};
function staticBar(p){
  const T=families(p.threats).map(g=>({...g,kind:"threat"}));
  const C=families(p.caps).map(g=>({...g,kind:"cap"}));
  const nf=(p.files||[]).length;
  if(!T.length&&!C.length&&!nf)return `<div class="stack solo" style="padding:20px 22px">
    <div class="none">No threats or capabilities recorded.</div></div>`;
  // A package can trip no rules and still have files worth measuring, so the
  // default landing tab is whichever section actually has something in it.
  if(!sel)sel={kind:(T.length||C.length)?"all":"entropy",key:null,rule:null};

  // The horizontal bar carries only the two kinds. Everything below that --
  // families and the rules inside them -- lives in the rail, so the bar stays
  // one line no matter how many rules a package trips.
  const bar=`<div class="bar">
    <button class="b" data-k="all" aria-pressed="${sel.kind==="all"}">All
      <span class="c${(p.threats.length+p.caps.length)?"":" zero"}">${p.threats.length+p.caps.length}</span></button>
    <button class="b threat" data-k="threat" aria-pressed="${sel.kind==="threat"}">
      Threats<span class="c${p.threats.length?"":" zero"}">${p.threats.length}</span></button>
    <button class="b" data-k="cap" aria-pressed="${sel.kind==="cap"}">
      Capabilities<span class="c${p.caps.length?"":" zero"}">${p.caps.length}</span></button>
    ${(p.files||[]).length?`<button class="b" data-k="entropy"
      aria-pressed="${sel.kind==="entropy"}">Entropy
      <span class="c">${p.files.length}</span></button>`:""}
  </div>`;

  if(sel.kind==="entropy"){
    // `e` is normalised entropy: Shannon entropy over the 256 byte values
    // divided by 8, so the scale is 0-1. Compressed, encrypted or packed data
    // sits near 1; source and text sit around 0.5-0.65.
    const files=[...(p.files||[])].sort((a,b)=>
      (typeof b.e==="number") - (typeof a.e==="number") || (b.e||0)-(a.e||0));
    return `${bar}<div class="stack solo">
      <div class="fhead"><span class="s1">File</span>
        <span class="s2">Entropy</span></div>
      ${files.map(f=>{
        // Files above ENTROPY_MAX_FILE_BYTES are hashed but not measured, so
        // `e` is null. Show the row with an empty bar rather than dropping it:
        // the hash and size are still worth having.
        const measured = typeof f.e === "number";
        return `<div class="frow ${measured&&f.e>=0.94?"fhi":""}">
        <div class="ftop"><span class="fpath">${esc(f.p)}</span>
          <span class="fscale"><span>0</span>
            <span class="fbar" tabindex="0"><i style="width:${
              measured?(f.e*100).toFixed(1):0}%"></i>
              <span class="tip">${measured?f.e.toFixed(3):"not measured"}</span></span>
            <span>1</span></span></div>
        <div class="fmeta"><span class="fsize">${kb(f.b)}</span>
          <span class="fhash">${esc(f.h)}</span></div>
      </div>`;}).join("")}</div>`;
  }

  const groups=sel.kind==="threat"?T:sel.kind==="cap"?C:[...T,...C];
  if(!groups.length){
    const what=sel.kind==="threat"?"threats":sel.kind==="cap"?"capabilities"
              :"threats or capabilities";
    return `${bar}<div class="stack solo" style="padding:20px 22px">
      <div class="none">No ${what} recorded.</div></div>`;
  }
  if(sel.key&&!groups.some(g=>g.key===sel.key)){sel.key=null;sel.rule=null;}
  const active=sel.key?groups.find(g=>g.key===sel.key):null;


  const item=g=>{
    const kids=Object.keys(g.rules),multi=kids.length>1;
    const isOpen=sel.key===g.key&&open[g.key]!==false;
    const suffix=r=>r===g.key?r:r.slice(g.key.length+1);
    return `<button class="b2" data-g="${esc(g.key)}" aria-pressed="${sel.key===g.key&&!sel.rule}">
      ${multi?`<span class="rcar ${isOpen?"":"closed"}"></span>`:`<span class="rgap"></span>`}
      <span class="n">${esc(pretty(g.key))}</span><span class="c">${g.n}</span></button>
      ${multi&&isOpen?`<div class="rkids">${kids.map(r=>`<button class="b3"
        data-g="${esc(g.key)}" data-r="${esc(r)}" aria-pressed="${sel.rule===r}">
        <span class="n">${esc(pretty(suffix(r)))}</span>
        <span class="c">${g.rules[r].length}</span></button>`).join("")}</div>`:""}`;
  };

  const rail=`<div class="rail">${
    sel.kind==="all"
      ? (T.length?`<div class="raillab">Threats</div>${T.map(item).join("")}`:"")
        +(C.length?`<div class="raillab">Capabilities</div>${C.map(item).join("")}`:"")
      : groups.map(item).join("")}</div>`;

  let shown={};
  if(!active)groups.forEach(g=>Object.entries(g.rules)
    .forEach(([r,it])=>{shown[r]=(shown[r]||[]).concat(it)}));
  else if(sel.rule)shown={[sel.rule]:active.rules[sel.rule]};
  else shown=active.rules;
  const multi=Object.keys(shown).length>1;

  const stack=`<div class="stack">${Object.entries(shown).map(([r,items])=>
    (multi?`<div class="rulehd">${esc(pretty(r))}<span class="c">${items.length}</span></div>`:"")
    +items.map(entry).join("")).join("")}</div>`;

  return `${bar}<div class="split">${rail}${stack}</div>`;
}

function render(){
  const p=ALL[cur];
  app.innerHTML = view==="landing" ? landing()
    : (p && p.threats) ? detail(p) : loading(p);
  const qi=document.getElementById("q");
  if(qi)qi.oninput=e=>{q=e.target.value.trim(); searchChanged();};
}
/* Cards carry only the summary row from /api/recent; the report itself is
   fetched when a package is opened, so the landing page stays one request. */
function loading(p){
  return `<a class="back" href="#" data-back>All packages</a>
    <div class="phead"><h1 class="ptitle">${esc((p&&p.name)||"")}</h1></div>
    <div class="none" style="padding:26px 0">Loading…</div>`;
}

async function openPackage(i){
  cur=i; view="detail"; sel=null; open={};
  const p=ALL[i];
  render(); scrollTo(0,0);
  if(p.threats) return;                       // already fetched
  try{
    ALL[i]={...p, ...await getPackage(p.name,p.version)};
  }catch(err){
    ALL[i]={...p, threats:[], caps:[], files:[], loadError:String(err.message||err),
      net:{package_connections:[],dns_lookups_non_npm:[],exfil_services_contacted:[]},
      cred:{canary_tokens_leaked:[],accessed_by_package:[],probed_but_absent:[],
            sensitive_file_access:[]},
      fs:{package_files_read:[],package_files_written:[],executed_by_package:[],
          dropped_and_executed:[],tmp_snooped:[],downloaded_artifacts:[],
          recon_dirs_enumerated:[],recon_dir_scan:false}};
  }
  render();
}

/* Ask the server for the filtered slice rather than narrowing what we already
   hold, so "Review" reaches every flagged package, not just the recent ones. */
async function refilter(){
  if(!API_BASE||usingFixtures){ render(); return; }
  try{
    ALL = await listRecent(LIMIT, filter==="ALL" ? null : filter, q || null);
  }catch(err){ console.warn("filter fetch failed:", err); }
  render();
}

// Typing shouldn't fire a request per keystroke, and a slow response for an
// earlier prefix must not overwrite a later one -- hence the sequence guard.
let searchTimer=null, searchSeq=0;
function searchChanged(){
  clearTimeout(searchTimer);
  const mine=++searchSeq;
  searchTimer=setTimeout(async ()=>{
    if(!API_BASE||usingFixtures){ render(); return; }
    try{
      const rows=await listRecent(LIMIT, filter==="ALL"?null:filter, q||null);
      if(mine!==searchSeq) return;          // a newer query already went out
      ALL=rows;
    }catch(err){ console.warn("search failed:", err); }
    render();
  }, 250);
}

async function boot(){
  if(API_BASE){
    try{
      ALL=await listRecent(LIMIT);
    }catch(err){
      console.warn("API unreachable, using fixtures:",err);
      ALL=FIXTURES; usingFixtures=true;
    }
  } else { ALL=FIXTURES; usingFixtures=true; }
  render();
}

document.getElementById("theme").onclick=()=>{const r=document.documentElement;
  r.dataset.theme=r.dataset.theme==="dark"?"light":"dark";};
document.addEventListener("click",e=>{
  const t=e.target;
  const db=t.closest("[data-ddbtn]");
  document.querySelectorAll("[data-ddbtn]").forEach(b=>{
    if(b!==db)b.setAttribute("aria-expanded","false");});
  if(db){db.setAttribute("aria-expanded",db.getAttribute("aria-expanded")!=="true");return;}
  const di=t.closest("[data-ver]");
  if(di){const v=di.dataset.ver,p=ALL[cur];
    if(v!==p.version){ALL[cur]={name:p.name,version:v,verdict:p.verdict,
      versions:p.versions,bytes:p.bytes,sha:p.sha,ago:p.ago};
      openPackage(cur);}
    return;}
  const kb=t.closest("[data-k]");
  if(kb){const y=scrollY;sel={kind:kb.dataset.k,key:null,rule:null};open={};
    render();scrollTo(0,y);return;}
  const bn=t.closest("[data-g]");
  if(bn){const y=scrollY,k=sel.kind;
    if(bn.dataset.r){sel={kind:k,key:bn.dataset.g,rule:bn.dataset.r};}
    else{
      // clicking the family you're already on folds its rules away
      if(sel.key===bn.dataset.g&&!sel.rule)open[bn.dataset.g]=open[bn.dataset.g]===false;
      else open[bn.dataset.g]=true;
      sel={kind:k,key:bn.dataset.g,rule:null};
    }
    render();scrollTo(0,y);return;}
  const bh=t.closest(".blockhead");
  if(bh){bh.setAttribute("aria-expanded",bh.getAttribute("aria-expanded")!=="true");return;}
  const f=t.closest("[data-f]");
  if(f){filter=f.dataset.f; refilter(); return;}
  const o=t.closest("[data-open]");
  if(o){e.preventDefault();openPackage(+o.dataset.open);return;}
  if(t.closest("[data-back]")){e.preventDefault();view="landing";render();scrollTo(0,0);return;}
  if(t.closest("[data-copy]")){navigator.clipboard?.writeText(
    document.getElementById("sha").textContent);
    t.textContent="Copied";setTimeout(()=>t.textContent="Copy",1400);}
});
boot();
